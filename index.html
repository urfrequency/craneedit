<title>EOT Cranes</title>
<style>
:root{--bg:#f1efee;--card:#fff;--ink:#1e1b1b;--mute:#6b6666;--line:#e4e1e0;--red:#d0202a;--redsoft:#fbe3e5;--amber:#e8a317;--ambersoft:#fdf1d3;--green:#2e8b57;--greensoft:#dcefe3;--blue:#2f6fb0;--bluesoft:#dce9f6;--field:#faf9f9}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1e1b1b;--ink:#f2efef;--mute:#a49e9e;--line:#332e2e;--red:#ee4a53;--redsoft:#4a1c20;--amber:#f0b43c;--ambersoft:#44360f;--green:#4cb97c;--greensoft:#17372a;--blue:#6aa7e6;--bluesoft:#1b2f44;--field:#262222}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Arial,Helvetica,sans-serif}
#app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media(min-width:520px){body{background:#2b2727}#app{box-shadow:0 0 40px #0008}}
.top{position:sticky;top:0;z-index:10;background:#1e1b1b;color:#fff;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:3px solid #d0202a}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:#fff;font-size:22px;width:38px;height:38px;border-radius:19px;cursor:pointer}
.ib:active{background:#fff3}
.pad{padding:14px}
.hero{background:#1e1b1b;color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.hero b{font-size:20px;display:block}.hero span{color:#ff8a92;font-size:13px}.hero small{display:block;color:#bbb;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:12px;padding:10px;border-left:4px solid var(--red)}
.stat i{font-style:normal;font-size:24px;font-weight:bold;display:block}.stat span{font-size:11px;color:var(--mute)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbtn{background:var(--card);border:0;border-radius:16px;padding:18px 12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 3px #0002;min-height:112px;display:block;width:100%}
.mbtn:active{transform:scale(.97)}
.mbtn .ic{font-size:30px;display:block;margin-bottom:6px}.mbtn b{display:block;font-size:15px}.mbtn span{font-size:12px;color:var(--mute)}
.mbtn.red{background:var(--red);color:#fff}.mbtn.red span{color:#ffd6d9}
.sec{font-size:12px;font-weight:bold;color:var(--mute);letter-spacing:.6px;margin:18px 4px 8px;text-transform:uppercase}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px #0001}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px #0001;color:inherit;text-decoration:none;border:0;width:100%;text-align:left;font:inherit}
.li:active{background:var(--line)}
.li .m{flex:1;min-width:0}.li b{display:block}.li small{color:var(--mute);display:block}.li .n{font-size:12.5px;color:var(--mute);margin-top:2px}
.li .arr{color:var(--mute);font-size:18px}
.big{font-size:26px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:bold;white-space:nowrap}
.ok{background:var(--greensoft);color:var(--green)}.watch{background:var(--ambersoft);color:#9a6a00}.over{background:var(--red);color:#fff}.re{background:var(--bluesoft);color:var(--blue)}.gray{background:var(--line);color:var(--mute)}
@media(prefers-color-scheme:dark){.watch{color:var(--amber)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:18px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;margin-bottom:10px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:12;width:56px;height:56px;border-radius:28px;border:0;background:var(--red);color:#fff;font-size:30px;box-shadow:0 4px 12px #0006;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:11}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:10.5px;color:var(--mute);text-decoration:none;font-weight:bold}
.nav a span{font-size:21px}.nav a.on{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;background:var(--red);color:#fff;padding:6px 7px;font-size:11.5px}td{padding:6px 7px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto;margin:-2px -4px}
td.c,th.c{text-align:center}.pend{background:var(--ambersoft);color:#9a6a00;text-align:center;font-size:11px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:bold}
h3{margin:0 0 8px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:17px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:bold}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px}
.fld textarea{min-height:70px}
.calc{background:var(--bluesoft);color:var(--blue);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;font-weight:bold}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:bold;cursor:pointer;background:var(--line);color:var(--ink)}
.btn.p{background:var(--red);color:#fff}.btn.d{background:var(--redsoft);color:var(--red);flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e1b1b;color:#fff;padding:10px 18px;border-radius:20px;z-index:40;font-size:13px;box-shadow:0 4px 12px #0006}
.empty{text-align:center;color:var(--mute);padding:34px 10px}.empty b{display:block;font-size:30px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:inherit;font-size:13px;font-weight:bold;color:var(--mute);cursor:pointer}.seg button.on{background:var(--card);color:var(--red);box-shadow:0 1px 3px #0003}
.tap tr:not(:first-child){cursor:pointer}.tap tr:not(:first-child):active{background:var(--line)}
.note{font-size:12px;color:var(--mute);margin:8px 4px}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum div{flex:1;background:var(--card);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--mute)}.sum b{display:block;font-size:20px;color:var(--ink)}
</style>
</head>

 const rows=all.filter(r=>HF==='all'||r.hoist===HF).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.hoist.localeCompare(b.hoist));
 const lat=latestRopes().filter(r=>r.crane===c),dates=[...new Set(rows.map(r=>r.date))];
 shell(c+' · Inspections',`<div class="card"><h3>Latest reading of each hoist</h3>${lat.length?lat.map(r=>{const k=calc(r);return`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0"><span>${esc(r.hoist)} · ${r.current} mm (${pc(k.red)}) <small style="color:var(--mute)">${fmt(r.date)}</small></span><span class="tag ${tagCls(k.check)}">${k.check}</span></div>`}).join(''):'No readings yet.'}</div>
 ${CUR_H.length>1?`<div class="chips"><button class="chip ${HF==='all'?'on':''}" onclick="HF='all';render()">All hoists</button>${CUR_H.map((h,i)=>`<button class="chip ${HF===h?'on':''}" onclick="HF=CUR_H[${i}];render()">${esc(h)}</button>`).join('')}</div>`:''}
 <div class="note">${rows.length} reading${rows.length==1?'':'s'} · newest first</div>
 ${dates.length?dates.map(d=>`<div class="sec">${fmt(d)}</div>${listItems('inspect',rows.filter(r=>r.date===d))}`).join(''):listItems('inspect',[])}<div style="margin-top:14px">${xbtn('inspect')}</div>`,{back:'#/records/inspect',fab:'inspect'})}

const hoistsFor=c=>D.specs.filter(s=>s.crane===c).map(s=>s.hoist);
function autoFor(crane,hoist,date){
 const sp=D.specs.find(s=>s.crane===crane&&s.hoist===hoist);if(!sp)return{};
 const ch=sp.kw?S.change.filter(r=>r.crane===crane&&r.date&&sp.kw.some(k=>(r.hoist||'').toLowerCase().includes(k))).sort((a,b)=>b.date.localeCompare(a.date)):[];
 const last=ch[0];let installed,length=sp.length;
 if(last){installed=fmt(last.date);length=+last.length||sp.length}
 else{const prev=S.inspect.filter(r=>r.crane===crane&&r.hoist===hoist&&r.installed).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];installed=prev?prev.installed:'Not changed yet'}
 return{std:sp.std,length,installed,replaced:last&&date&&last.date>date?last.date:'',fromLog:!!last}}

// ---------- form
function edit(key,id){
 const c=C[key];const isNew=!id;const newIns=isNew&&key==='inspect';const FL=newIns?c.fieldsNew:c.fields;let dirty=false;const rec=isNew?{...(c.def?c.def():{}),...(key==='inspect'?PRESET:{})}:{...S[key].find(r=>r.id===id)};
 const hl=`<datalist id="hoists">${hoistList().map(h=>`<option value="${esc(h)}">`).join('')}</datalist>`;
 const fld=f=>{const v=rec[f.k]??'';const nm=`f_${f.k}`;let inp;
  if(newIns&&f.k==='hoist'){f.o=hoistsFor(rec.crane);if(!rec.hoist)rec.hoist=f.o[0]||''}
  if(f.t==='select')inp=`<select id="${nm}">${f.o.map(o=>`<option ${o===v?'selected':''} value="${esc(o)}">${o||'— select —'}</option>`).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${nm}">${esc(v)}</textarea>`;
  else if(f.t==='number')inp=`<input id="${nm}" type="number" inputmode="decimal" step="any" value="${esc(v)}">`;
  else inp=`<input id="${nm}" type="${f.t==='date'?'date':f.t==='month'?'month':'text'}" ${f.list?'list="hoists"':''} value="${esc(v)}">`;
  return `<div class="fld"><label>${f.l}${f.req?' *':''}</label>${inp}</div>`};
 const bg=document.createElement('div');bg.className='sheet-bg';
 bg.innerHTML=`<div class="sheet"><h2>${isNew?c.add:'Edit record'}</h2>${hl}${FL.map(fld).join('')}${newIns?'<div class="calc" id="auto"></div>':''}${c.calc?'<div class="calc" id="calc"></div>':''}<div class="btns">${isNew?'':'<button class="btn d" id="del">Delete</button>'}<button class="btn" id="cancel">Cancel</button><button class="btn p" id="ok">Save</button></div></div>`;
 document.body.appendChild(bg);
 const read=()=>{const o={};FL.forEach(f=>{let v=$('#f_'+f.k).value;if(f.t==='number'&&v!=='')v=+v;o[f.k]=v});if(newIns)Object.assign(o,(({std,length,replaced})=>({std,length,replaced}))(autoFor(o.crane,o.hoist,o.date)));return o};
 const upd=()=>{if(!c.calc)return;if(newIns){const a=autoFor($('#f_crane').value,$('#f_hoist').value,$('#f_date').value);if(!dirty&&a.installed)$('#f_installed').value=a.installed;$('#auto').textContent=a.std?`Standard ${a.std} mm · length ${a.length} ft · last installed ${$('#f_installed').value||'–'}${a.fromLog?' (from rope change record)':''}`:'Choose a hoist'}const o=read();const k=calc(o);$('#calc').textContent=k.red==null?'Enter standard and current size to see reduction':`Reduction ${pc(k.red,2)} · limit ${pc(k.lim,0)} · discard at ${k.disc.toFixed(2)} mm · ${k.check}`};
 bg.addEventListener('input',e=>{if(newIns){if(e.target.id==='f_crane'){$('#f_hoist').innerHTML=hoistsFor(e.target.value).map(h=>`<option>${esc(h)}</option>`).join('');dirty=false}if(e.target.id==='f_hoist'||e.target.id==='f_date')dirty=false;if(e.target.id==='f_installed')dirty=true}upd()});upd();
 bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});
 $('#cancel').onclick=()=>bg.remove();
 $('#ok').onclick=()=>{const o=read();const miss=FL.find(f=>f.req&&(o[f.k]===''||o[f.k]==null));if(miss){toast(`Please fill: ${miss.l}`);return}
  if(isNew)S[key].push({id:uid(),...o});else Object.assign(S[key].find(r=>r.id===id),o);save();bg.remove();toast(isNew?'Saved':'Updated');render()};
 if(!isNew)$('#del').onclick=()=>{if(confirm('Delete this record?')){S[key]=S[key].filter(r=>r.id!==id);save();bg.remove();toast('Deleted');render()}}}

// ---------- export / settings
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csv(key){const c=C[key];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;dl(`${key}_${today()}.csv`,'﻿'+[c.fields.map(f=>q(f.l)).join(','),...S[key].map(r=>c.fields.map(f=>q(r[f.k])).join(','))].join('\r\n'),'text/csv')}
function settings(){const bg=document.createElement('div');bg.className='sheet-bg';
 bg.innerHTML=`<div class="sheet"><h2>⚙ Data & backup</h2><p class="note" style="margin:0 0 12px">Records you add or edit are saved in this browser on this device. Use backup to move them to another phone or computer.</p>
 <div class="btns" style="flex-direction:column"><button class="btn" id="exp">⬇ Backup all records (JSON)</button><button class="btn" id="imp">⬆ Restore from backup file</button><button class="btn d" id="rst" style="flex:1">Reset to original sample data</button><button class="btn" id="cl">Close</button></div><input type="file" id="file" accept="application/json" hidden></div>`;
 document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};
 $('#cl').onclick=()=>bg.remove();$('#exp').onclick=()=>dl(`EOT_Crane_App_backup_${today()}.json`,JSON.stringify(S,null,1),'application/json');
 $('#imp').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.change||!o.inspect)throw 0;if(!confirm('Replace all current records with this backup?'))return;S=o;for(const k in D.seed)if(!S[k])S[k]=[];if(!S.dims)S.dims=JSON.parse(JSON.stringify(D.dims));save();bg.remove();toast('Backup restored');render()}catch(x){toast('That file is not a valid backup')}};r.readAsText(f)};
 $('#rst').onclick=()=>{if(confirm('Delete all your edits and go back to the original data?')){S=seed();save();bg.remove();toast('Reset done');render()}}}
